<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dragon Primordial — Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:#020005;}

canvas{position:absolute;top:0;left:0;z-index:1;}

/* ── PÁJARO ── */
#bird{
  position:absolute;z-index:5;
  width:260px;
  image-rendering:crisp-edges;
  pointer-events:none;
  transition:filter 0.1s;
  filter:drop-shadow(0 0 18px rgba(255,160,60,.7)) drop-shadow(0 0 35px rgba(200,80,0,.4));
}

/* ── TEXTO SUPERIOR ── */
.top-text{
  position:absolute;top:140px;left:0;right:0;
  text-align:center;z-index:6;
  animation:tfadein 2.5s ease 0.8s both;
}
.main-title{
  font-family:'Cinzel Decorative',serif;
  font-size:96px;font-weight:900;
  color:#fff;letter-spacing:6px;
  text-shadow:0 0 40px #ff2200,0 0 80px #cc0000,0 0 120px #880000;
  animation:tglow 2.5s ease-in-out infinite alternate;
}
@keyframes tglow{
  0%{text-shadow:0 0 30px #ff2200,0 0 60px #cc0000;}
  100%{text-shadow:0 0 60px #ff5500,0 0 100px #ff2200,0 0 150px #cc0000;}
}
@keyframes tfadein{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:none;}}

/* ── TEXTO INFERIOR ── */
.bottom-text{
  position:absolute;bottom:140px;left:0;right:0;
  text-align:center;z-index:6;
  animation:bfadein 3s ease 1.5s both;
}
@keyframes bfadein{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.sub-title{
  font-family:'Cinzel',serif;
  font-size:36px;letter-spacing:20px;color:#cc3300;
  text-transform:uppercase;text-shadow:0 0 20px rgba(200,50,0,.6);
  margin-bottom:14px;
}
.social-row{display:flex;justify-content:center;gap:40px;margin-top:12px;}
.social-pill{
  font-family:'Cinzel',serif;font-size:15px;letter-spacing:3px;
  color:#aa3300;border:1px solid #6b0000;padding:6px 22px;
}

/* ── DECORACIONES ── */
.top-bar,.bottom-bar{
  position:absolute;left:0;right:0;height:4px;z-index:7;
  background:linear-gradient(90deg,transparent,#8b0000,#cc0000,#ff2200,#cc0000,#8b0000,transparent);
}
.top-bar{top:0;}.bottom-bar{bottom:0;}
.hline{position:absolute;left:60px;right:60px;height:1px;z-index:3;
  background:linear-gradient(90deg,transparent,#5a0000,#cc0000,#5a0000,transparent);}
.corner{position:absolute;width:80px;height:80px;border-color:#6b0000;border-style:solid;opacity:.7;z-index:7;}
.ctleft{top:30px;left:30px;border-width:3px 0 0 3px;border-radius:6px 0 0 0;}
.ctright{top:30px;right:30px;border-width:3px 3px 0 0;border-radius:0 6px 0 0;}
.cbleft{bottom:30px;left:30px;border-width:0 0 3px 3px;border-radius:0 0 0 6px;}
.cbright{bottom:30px;right:30px;border-width:0 3px 3px 0;border-radius:0 0 6px 0;}

/* Scan */
.scan{position:absolute;left:0;right:0;height:2px;
  background:rgba(255,60,0,.08);animation:scn 7s linear infinite;z-index:2;}
@keyframes scn{0%{top:-2px;}100%{top:1082px;}}
</style>
</head>

/* ═══ SETUP CANVAS ═══════════════════════════════════════════════════ */
const canvas = document.getElementById('bgCanvas');
canvas.width = 1920; canvas.height = 1080;
const ctx = canvas.getContext('2d');

/* ═══ ESTADO DEL PÁJARO ══════════════════════════════════════════════ */
const birdEl = document.getElementById('bird');
const BIRD_W = 260;

const bird = {
  x: -BIRD_W - 50,
  frame: 0, frameDir: 1, frameTimer: 0,
  movingForward: true,
  speed: 5.5,
};

function getBirdY() {
  return 480 + Math.sin(bird.x / 380) * 90;
}

/* ═══ PARTÍCULAS ══════════════════════════════════════════════════════ */
let particles = [];

function spawnParticles(x, y, forward) {
  const n = forward ? 4 : 1;
  for (let i = 0; i < n; i++) {
    const hue = forward ? 10 + Math.random() * 40 : 220 + Math.random() * 40;
    particles.push({
      x: x + (forward ? -10 : 10) + (Math.random() - 0.5) * 30,
      y: y + (Math.random() - 0.5) * 20,
      vx: (forward ? -1 : 1) * (Math.random() * 1.5 + 0.5),
      vy: (Math.random() - 0.5) * 1.2,
      life: 1,
      decay: 0.018 + Math.random() * 0.025,
      size: Math.random() * 7 + 2,
      hue,
    });
  }
}

/* ═══ RENDER ══════════════════════════════════════════════════════════ */
function render() {
  ctx.clearRect(0, 0, 1920, 1080);

  /* Fondo */
  const bg = ctx.createRadialGradient(960, 540, 0, 960, 540, 900);
  bg.addColorStop(0, '#0a0006');
  bg.addColorStop(1, '#020002');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1920, 1080);

  /* Rayos de luz sutiles desde el centro */
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let a = 0; a < 360; a += 15) {
    const rad = a * Math.PI / 180;
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 80;
    ctx.beginPath();
    ctx.moveTo(960, 540);
    ctx.lineTo(960 + Math.cos(rad) * 1200, 540 + Math.sin(rad) * 1200);
    ctx.stroke();
  }
  ctx.restore();

  /* Glow que sigue al pájaro */
  const by = getBirdY();
  const bx = bird.x + BIRD_W / 2;
  const grd = ctx.createRadialGradient(bx, by, 0, bx, by, 320);
  grd.addColorStop(0, bird.movingForward ? 'rgba(255,100,20,.12)' : 'rgba(80,60,200,.1)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, 1920, 1080);

  /* Partículas */
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life * 0.9;
    ctx.fillStyle = `hsl(${p.hue}, 100%, ${50 + p.life * 20}%)`;
    ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  /* Vignette */
  const vig = ctx.createRadialGradient(960, 540, 300, 960, 540, 1000);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, 1920, 1080);
}

/* ═══ UPDATE ══════════════════════════════════════════════════════════ */
function update() {
  /* Mover pájaro */
  bird.x += bird.movingForward ? bird.speed : -bird.speed * 0.9;

  /* Transiciones de ida/vuelta */
  if (bird.movingForward && bird.x > 1980) {
    bird.movingForward = false;
    bird.x = 1980;
  } else if (!bird.movingForward && bird.x < -BIRD_W - 50) {
    bird.movingForward = true;
    bird.x = -BIRD_W - 50;
  }

  /* Animación de frames (como el script de Roblox: pingpong) */
  bird.frameTimer++;
  if (bird.frameTimer >= 4) {
    bird.frameTimer = 0;
    if (bird.movingForward) {
      bird.frame += bird.frameDir;
      if (bird.frame >= FRAMES.length) { bird.frame = FRAMES.length - 2; bird.frameDir = -1; }
      if (bird.frame < 0) { bird.frame = 1; bird.frameDir = 1; }
    }
    // Al regresar: frame fijo 0 (planeando)
  }

  /* Posicionar imagen del pájaro */
  const by = getBirdY();
  birdEl.style.left = bird.x + 'px';
  birdEl.style.top  = by + 'px';
  birdEl.src = FRAMES[bird.movingForward ? bird.frame : 0];
  birdEl.style.transform = bird.movingForward ? 'scaleX(1)' : 'scaleX(-1)';

  /* Partículas trail */
  if (Math.random() < 0.75) {
    spawnParticles(bird.movingForward ? bird.x : bird.x + BIRD_W, by + 60, bird.movingForward);
  }

  /* Update partículas */
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy -= 0.025;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0 && particles.length < 300);
}

/* ═══ LOOP PRINCIPAL ═══════════════════════════════════════════════════ */
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

birdEl.onload = () => loop();
birdEl.src = FRAMES[0];

/* ═══ SONIDOS (Web Audio API) ═════════════════════════════════════════ */
let audioCtx = null;
let flapInterval = null;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  /* — DRONE AMBIENTE — */
  [55, 82, 110].forEach((fr, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const lf = audioCtx.createOscillator(), lg = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = fr;
    lf.frequency.value = 0.08 + i * 0.04; lg.gain.value = 1.5;
    lf.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.04 - i * 0.008, audioCtx.currentTime + 3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); lf.start();
  });

  /* — INTRO SWEEP — */
  (function introSweep() {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(55, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 2.5);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(200, audioCtx.currentTime);
    f.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + 2.5);
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.5);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
    o.connect(f); f.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 3.2);
  })();

  /* — ALETEO DEL PÁJARO (cada ~380ms cuando va hacia adelante) — */
  function flapSound() {
    if (!bird.movingForward) return;
    const A = audioCtx;
    // Aire batido: noise burst filtrado
    const dur = 0.12;
    const b = A.createBuffer(1, Math.floor(A.sampleRate * dur), A.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 0.8) * 0.15;
    const s = A.createBufferSource(); s.buffer = b;
    const bp = A.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 800; bp.Q.value = 1.5;
    const g = A.createGain(); g.gain.value = 0.35;
    s.connect(bp); bp.connect(g); g.connect(A.destination); s.start();

    // Hit bajo suave
    const o = A.createOscillator(), og = A.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(120, A.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, A.currentTime + 0.08);
    og.gain.setValueAtTime(0.12, A.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001, A.currentTime + 0.1);
    o.connect(og); og.connect(A.destination); o.start(); o.stop(A.currentTime + 0.12);
  }

  flapInterval = setInterval(flapSound, 380);

  /* — GLOW SONIDO cuando pasa por el centro — */
  setInterval(() => {
    if (Math.abs(bird.x - 960) < 100 && bird.movingForward) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 220;
      g.gain.setValueAtTime(0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 1.6);
    }
  }, 800);
}

/* Arrancar audio al primer clic/carga (OBS arranca automático) */
window.addEventListener('load', () => setTimeout(initAudio, 600));
document.addEventListener('click', () => { if (!audioCtx) initAudio(); });
</script>
