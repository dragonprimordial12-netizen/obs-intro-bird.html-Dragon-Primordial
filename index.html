<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dragon Primordial — Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
canvas{position:absolute;top:0;left:0;z-index:1;}

/* ── PÁJARO ── */
#bird{
  position:absolute;z-index:6;width:300px;
  pointer-events:none;
  filter:drop-shadow(0 0 22px rgba(255,140,40,.9))
         drop-shadow(0 0 50px rgba(200,70,0,.6))
         drop-shadow(0 0 80px rgba(255,50,0,.3));
  transition:filter 0.15s;
}

/* ── FLASH DE ENTRADA ── */
#flash{
  position:absolute;inset:0;z-index:10;
  background:radial-gradient(ellipse at 5% 50%, rgba(255,120,0,.45) 0%, transparent 60%);
  opacity:0;pointer-events:none;
}

/* ── TÍTULO SUPERIOR ── */
.top-text{
  position:absolute;top:130px;left:0;right:0;
  text-align:center;z-index:7;opacity:0;
  animation:slidein 2s cubic-bezier(.16,1,.3,1) 1s forwards;
}
@keyframes slidein{
  from{opacity:0;transform:translateY(-35px) scale(.95);}
  to{opacity:1;transform:none;}
}
.main-title{
  font-family:'Cinzel Decorative',serif;font-weight:900;
  font-size:104px;color:#fff;letter-spacing:6px;
  text-shadow:0 0 50px #ff2200,0 0 100px #cc0000,0 0 160px #880000;
  animation:tglow 2s ease-in-out infinite alternate;
}
@keyframes tglow{
  0%{text-shadow:0 0 40px #ff2200,0 0 80px #cc0000,0 0 120px #880000;}
  100%{text-shadow:0 0 70px #ff5500,0 0 120px #ff2200,0 0 200px #cc0000;}
}
.pre-title{
  font-family:'Cinzel',serif;font-size:20px;
  letter-spacing:16px;color:#aa3300;margin-bottom:12px;
  text-transform:uppercase;opacity:.8;
}

/* ── TEXTO INFERIOR ── */
.bottom-text{
  position:absolute;bottom:130px;left:0;right:0;
  text-align:center;z-index:7;opacity:0;
  animation:slideup 2s cubic-bezier(.16,1,.3,1) 1.8s forwards;
}
@keyframes slideup{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:none;}
}
.sub-title{
  font-family:'Cinzel',serif;font-size:38px;
  letter-spacing:22px;color:#cc3300;
  text-shadow:0 0 25px rgba(200,50,0,.7);margin-bottom:18px;
}
.social-row{display:flex;justify-content:center;gap:44px;}
.social-pill{
  font-family:'Cinzel',serif;font-size:15px;letter-spacing:3px;
  color:#993300;border:1px solid rgba(120,20,0,.6);padding:7px 24px;
  background:rgba(80,0,0,.25);
}

/* ── DECORACIONES ── */
.top-bar,.bottom-bar{
  position:absolute;left:0;right:0;height:4px;z-index:8;
  background:linear-gradient(90deg,transparent,#6b0000,#cc0000,#ff2200,#cc0000,#6b0000,transparent);
}
.top-bar{top:0;} .bottom-bar{bottom:0;}
.hline{position:absolute;left:80px;right:80px;height:1px;z-index:3;
  background:linear-gradient(90deg,transparent,#4a0000,#cc0000,#4a0000,transparent);}
.corner{position:absolute;width:90px;height:90px;border-color:#6b0000;border-style:solid;opacity:.75;z-index:8;}
.ctleft{top:28px;left:28px;border-width:3px 0 0 3px;border-radius:6px 0 0 0;}
.ctright{top:28px;right:28px;border-width:3px 3px 0 0;border-radius:0 6px 0 0;}
.cbleft{bottom:28px;left:28px;border-width:0 0 3px 3px;border-radius:0 0 0 6px;}
.cbright{bottom:28px;right:28px;border-width:0 3px 3px 0;border-radius:0 0 6px 0;}
.scan{position:absolute;left:0;right:0;height:2px;
  background:rgba(255,60,0,.07);animation:scn 8s linear infinite;z-index:2;}
@keyframes scn{0%{top:-2px;}100%{top:1082px;}}
</style>
</head>

/* ══ CANVAS ══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('bgCanvas');
canvas.width = 1920; canvas.height = 1080;
const ctx = canvas.getContext('2d');

const birdEl = document.getElementById('bird');
const flashEl = document.getElementById('flash');
const BIRD_W = 300;

/* ══ ESTADO ══════════════════════════════════════════════════════════════ */
const bird = {
  x: -BIRD_W - 60,
  frame: 0, frameDir: 1, frameTimer: 0,
  movingForward: true,
  speed: 2.2,        // lento = majestuoso
  centerHit: false,  // para disparo del sonido central
};
let tick = 0;
let flashAlpha = 0;
let particles = [];
let lightAngle = 0;

function getBirdY() {
  // Onda senoidal suave: recorre el centro de la pantalla
  return 490 + Math.sin(bird.x / 500) * 110;
}

/* ══ PARTÍCULAS ══════════════════════════════════════════════════════════ */
function spawnParticles(x, y, forward) {
  const n = forward ? 6 : 2;
  for (let i = 0; i < n; i++) {
    const hue   = forward ? 10 + Math.random()*40 : 200+Math.random()*50;
    const large = Math.random() < 0.2;
    particles.push({
      x: x + (Math.random()-0.5)*40,
      y: y + (Math.random()-0.5)*25,
      vx: (forward ? -1 : 1) * (Math.random()*2+0.3),
      vy: (Math.random()-0.5)*1.5 - 0.3,
      life: 1,
      decay: large ? 0.008 : 0.018 + Math.random()*0.022,
      size: large ? Math.random()*14+6 : Math.random()*6+2,
      hue,
    });
  }
}

/* ══ RENDER ══════════════════════════════════════════════════════════════ */
function render() {
  ctx.clearRect(0, 0, 1920, 1080);

  /* Fondo */
  const bg = ctx.createRadialGradient(960,540,0, 960,540,960);
  bg.addColorStop(0,'#0d0003');
  bg.addColorStop(1,'#010001');
  ctx.fillStyle = bg; ctx.fillRect(0,0,1920,1080);

  /* Rayos de luz giratorios desde el centro */
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.translate(960,540);
  for (let a = 0; a < 12; a++) {
    const angle = lightAngle + a*(Math.PI/6);
    ctx.save();
    ctx.rotate(angle);
    const rg = ctx.createLinearGradient(0,0,900,0);
    rg.addColorStop(0,'rgba(255,80,0,.9)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0,-60,900,120);
    ctx.restore();
  }
  ctx.restore();

  /* Glow grande del pájaro */
  const bx = bird.x + BIRD_W/2;
  const by = getBirdY() + 80;
  const dist = Math.abs(bx - 960) / 960; // 0=centro, 1=bordes
  const glowR = 420 + dist*(-150); // más grande al pasar por el centro
  const glowAlpha = bird.movingForward ? 0.16 : 0.09;
  const gc = ctx.createRadialGradient(bx,by,0, bx,by,glowR);
  gc.addColorStop(0, bird.movingForward
    ? `rgba(255,100,20,${glowAlpha})`
    : `rgba(60,40,200,${glowAlpha*0.7})`);
  gc.addColorStop(0.4, bird.movingForward
    ? `rgba(180,40,0,${glowAlpha*0.4})`
    : `rgba(30,20,120,${glowAlpha*0.3})`);
  gc.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = gc; ctx.fillRect(0,0,1920,1080);

  /* Halo extra cuando pasa por el centro (dist < 0.15) */
  if (dist < 0.15 && bird.movingForward) {
    const pulse = 1 - dist/0.15;
    const hc = ctx.createRadialGradient(960,540,0, 960,540,600*pulse);
    hc.addColorStop(0,`rgba(255,80,0,${0.1*pulse})`);
    hc.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = hc; ctx.fillRect(0,0,1920,1080);
  }

  /* Partículas */
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life*0.88);
    ctx.fillStyle = `hsl(${p.hue},100%,${45+p.life*25}%)`;
    ctx.shadowColor  = `hsl(${p.hue},100%,60%)`;
    ctx.shadowBlur   = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  /* Flash de entrada */
  if (flashAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    const fl = ctx.createRadialGradient(0,540,0, 0,540,900);
    fl.addColorStop(0,'rgba(255,130,0,1)');
    fl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = fl; ctx.fillRect(0,0,1920,1080);
    ctx.restore();
    flashAlpha = Math.max(0, flashAlpha-0.025);
  }

  /* Vignette */
  const vig = ctx.createRadialGradient(960,540,280, 960,540,1050);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.fillStyle = vig; ctx.fillRect(0,0,1920,1080);
}

/* ══ UPDATE ══════════════════════════════════════════════════════════════ */
function update() {
  tick++;
  lightAngle += 0.002; // rotación lenta de los rayos

  /* Mover pájaro */
  bird.x += bird.movingForward ? bird.speed : -bird.speed*0.8;

  /* Flash al entrar */
  if (bird.movingForward && bird.x > -BIRD_W && bird.x < -BIRD_W+8) {
    flashAlpha = 0.65;
    playEntrySound();
  }

  /* Boom al cruzar el centro */
  const bxCenter = bird.x + BIRD_W/2;
  if (bird.movingForward && !bird.centerHit && bxCenter > 940 && bxCenter < 980) {
    bird.centerHit = true;
    playCenterHit();
  }

  /* Cambio de dirección */
  if (bird.movingForward && bird.x > 1960) {
    bird.movingForward = false;
    bird.centerHit = false;
    bird.x = 1960;
  } else if (!bird.movingForward && bird.x < -BIRD_W-60) {
    bird.movingForward = true;
    bird.x = -BIRD_W-60;
  }

  /* Frame animation (pingpong igual al script Roblox) */
  bird.frameTimer++;
  const frameRate = bird.movingForward ? 5 : 99; // al regresar: frame fijo
  if (bird.frameTimer >= frameRate) {
    bird.frameTimer = 0;
    bird.frame += bird.frameDir;
    if (bird.frame >= FRAMES.length) { bird.frame = FRAMES.length-2; bird.frameDir=-1; }
    if (bird.frame < 0) { bird.frame = 1; bird.frameDir = 1; }
  }

  /* Posicionar */
  const by = getBirdY();
  birdEl.style.left = bird.x + 'px';
  birdEl.style.top  = by + 'px';
  birdEl.src = FRAMES[bird.movingForward ? bird.frame : 0];
  birdEl.style.transform = bird.movingForward ? 'scaleX(1)' : 'scaleX(-1)';

  /* Escala: se hace más grande al pasar por el centro */
  const distC = Math.abs((bird.x+BIRD_W/2) - 960) / 960;
  const scale = bird.movingForward ? (1 + (1-distC)*0.18) : 1;
  birdEl.style.transform = (bird.movingForward ? 'scaleX(1)' : 'scaleX(-1)') + ` scale(${scale.toFixed(3)})`;

  /* Partículas */
  if (Math.random() < 0.85)
    spawnParticles(
      bird.movingForward ? bird.x+10 : bird.x+BIRD_W-10,
      by + 70,
      bird.movingForward
    );

  /* Update partículas */
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy -= 0.035;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 400) particles.splice(0, 50);
}

/* ══ LOOP ════════════════════════════════════════════════════════════════ */
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
birdEl.onload = () => loop();
birdEl.src = FRAMES[0];

/* ══ SONIDOS ═════════════════════════════════════════════════════════════ */
let A = null;
let flapId = null;

function initAudio() {
  if (A) return;
  A = new (window.AudioContext||window.webkitAudioContext)();

  /* Drone oscuro de fondo */
  [55, 82, 110, 165].forEach((fr, i) => {
    const o=A.createOscillator(), g=A.createGain();
    const lf=A.createOscillator(), lg=A.createGain();
    o.type='sine'; o.frequency.value=fr;
    lf.frequency.value=0.07+i*0.03; lg.gain.value=1.8;
    lf.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0, A.currentTime);
    g.gain.linearRampToValueAtTime(0.038-i*0.006, A.currentTime+4);
    o.connect(g); g.connect(A.destination); o.start(); lf.start();
  });

  /* Sweep épico de apertura */
  const sweepFreqs = [[55,1.2],[82,1.6],[110,2],[165,2.4],[220,2.7]];
  sweepFreqs.forEach(([fr, t]) => {
    const o=A.createOscillator(), g=A.createGain(), f=A.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=fr;
    f.type='lowpass';
    f.frequency.setValueAtTime(180, A.currentTime+t);
    f.frequency.exponentialRampToValueAtTime(3200, A.currentTime+t+1.8);
    g.gain.setValueAtTime(0, A.currentTime+t);
    g.gain.linearRampToValueAtTime(0.16, A.currentTime+t+0.4);
    g.gain.exponentialRampToValueAtTime(0.001, A.currentTime+t+3);
    o.connect(f); f.connect(g); g.connect(A.destination);
    o.start(A.currentTime+t); o.stop(A.currentTime+t+3.5);
  });

  /* Aleteo periódico */
  flapId = setInterval(() => {
    if (!A || !bird.movingForward) return;
    // Noise burst (aire batido)
    const b=A.createBuffer(1,Math.floor(A.sampleRate*.14),A.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,.7)*.18;
    const s=A.createBufferSource(); s.buffer=b;
    const bp=A.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=1.2;
    const g=A.createGain(); g.gain.value=0.38;
    s.connect(bp); bp.connect(g); g.connect(A.destination); s.start();
    // Hit bajo
    const o=A.createOscillator(), og=A.createGain();
    o.type='sine'; o.frequency.setValueAtTime(130,A.currentTime);
    o.frequency.exponentialRampToValueAtTime(45,A.currentTime+.1);
    og.gain.setValueAtTime(0.14,A.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001,A.currentTime+.12);
    o.connect(og); og.connect(A.destination); o.start(); o.stop(A.currentTime+.14);
  }, 420);
}

/* Flash de entrada: whoosh + boom */
function playEntrySound() {
  if (!A) return;
  // Whoosh
  const b=A.createBuffer(1,Math.floor(A.sampleRate*.6),A.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,.5)*.25;
  const s=A.createBufferSource(); s.buffer=b;
  const hp=A.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
  const g=A.createGain();
  g.gain.setValueAtTime(.7,A.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.6);
  s.connect(hp); hp.connect(g); g.connect(A.destination); s.start();
}

/* Hit dramático al cruzar el centro */
function playCenterHit() {
  if (!A) return;
  // Bajo profundo
  const o=A.createOscillator(), g=A.createGain();
  o.type='sine'; o.frequency.setValueAtTime(80,A.currentTime);
  o.frequency.exponentialRampToValueAtTime(30,A.currentTime+.5);
  g.gain.setValueAtTime(.55,A.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,A.currentTime+1.2);
  o.connect(g); g.connect(A.destination); o.start(); o.stop(A.currentTime+1.3);
  // Acorde épico (Am)
  [220,277,330,440].forEach((fr,i)=>{
    const oc=A.createOscillator(), gc=A.createGain();
    oc.type='triangle'; oc.frequency.value=fr;
    gc.gain.setValueAtTime(0,A.currentTime+i*0.04);
    gc.gain.linearRampToValueAtTime(0.12,A.currentTime+i*0.04+0.2);
    gc.gain.exponentialRampToValueAtTime(0.001,A.currentTime+2.5);
    const dl=A.createDelay(); dl.delayTime.value=0.28;
    const dg=A.createGain(); dg.gain.value=0.25;
    oc.connect(gc); gc.connect(A.destination);
    gc.connect(dl); dl.connect(dg); dg.connect(A.destination);
    oc.start(A.currentTime+i*0.04); oc.stop(A.currentTime+3);
  });
  // Rumble de impacto
  const rb=A.createBuffer(1,Math.floor(A.sampleRate*.4),A.sampleRate);
  const rd=rb.getChannelData(0);
  for(let i=0;i<rd.length;i++) rd[i]=(Math.random()*2-1)*Math.pow(1-i/rd.length,.4)*.3;
  const rs=A.createBufferSource(); rs.buffer=rb;
  const rlp=A.createBiquadFilter(); rlp.type='lowpass'; rlp.frequency.value=100;
  const rg=A.createGain(); rg.gain.value=.6;
  rs.connect(rlp); rlp.connect(rg); rg.connect(A.destination); rs.start();
}

window.addEventListener('load', () => setTimeout(initAudio, 400));
document.addEventListener('click', () => initAudio());
</script>
